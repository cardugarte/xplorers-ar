db = "./strfry-db/"

relay {
    info {
        name = "Xplorers Relay"
        description = "Relay para la comunidad de campings de Argentina"
        pubkey = ""
        contact = "relay@xplorers.ar"
        icon = "https://xplorers.ar/icon.png"
    }

    # Max WebSocket payload: 128KB
    maxWebsocketPayloadSize = 131072

    autoPingSeconds = 55

    # Reject events not in the allowed kinds list via write policy plugin
    writePolicy {
        plugin = "/app/write-policy.ts"
    }
}

# Rate limiting
events {
    maxEventSize = 131072
}
