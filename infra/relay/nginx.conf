# Rate limiting zone (10MB shared memory, 20 req/s per IP)
limit_req_zone $binary_remote_addr zone=nostr:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name relay.xplorers.ar;

    ssl_certificate /etc/letsencrypt/live/relay.xplorers.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.xplorers.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=nostr burst=40 nodelay;

        proxy_pass http://strfry:7777;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass Accept header so NIP-11 HTTP responses work
        proxy_set_header Accept $http_accept;

        # WebSocket timeout — critical, default 60s kills long-lived connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name relay.xplorers.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
